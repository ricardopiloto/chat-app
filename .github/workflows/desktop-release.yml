name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject a tag that does not match the desktop version
        if: github.ref_type == 'tag'
        working-directory: frontend/electron
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop tag must be vX.Y.Z."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=${tag} electron/package.json=${version}"
          if [ "$tag" != "$version" ]; then
            echo "A tag v* tem de ser exactamente a versão de frontend/electron/package.json."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app and the Electron main process
        working-directory: frontend
        run: |
          npm run build
          npx tsc -p electron/tsconfig.json
          npx tsc -p electron/tsconfig.preload.json
          mv -f electron/dist/preload.js electron/dist/preload.cjs
          cp electron/screen-picker.html electron/dist/screen-picker.html

      - name: Package Linux AppImage
        working-directory: frontend/electron
        run: npx --prefix .. electron-builder --projectDir .. --config "${GITHUB_WORKSPACE}/frontend/electron-builder.yml" --linux AppImage --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: parley-linux
          path: |
            frontend/release/*.AppImage
            frontend/release/latest-linux.yml
            frontend/release/*.blockmap
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject a tag that does not match the desktop version
        if: github.ref_type == 'tag'
        shell: bash
        working-directory: frontend/electron
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop tag must be vX.Y.Z."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=${tag} electron/package.json=${version}"
          if [ "$tag" != "$version" ]; then
            echo "A tag v* tem de ser exactamente a versão de frontend/electron/package.json."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app and the Electron main process
        working-directory: frontend
        shell: bash
        run: |
          npm run build
          npx tsc -p electron/tsconfig.json
          npx tsc -p electron/tsconfig.preload.json
          mv -f electron/dist/preload.js electron/dist/preload.cjs
          cp electron/screen-picker.html electron/dist/screen-picker.html

      - name: Package Windows NSIS installer
        working-directory: frontend/electron
        shell: bash
        run: npx --prefix .. electron-builder --projectDir .. --config "${GITHUB_WORKSPACE}/frontend/electron-builder.yml" --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: parley-windows
          path: |
            frontend/release/*.exe
            frontend/release/latest.yml
            frontend/release/*.blockmap
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject a tag that does not match the desktop version
        if: github.ref_type == 'tag'
        working-directory: frontend/electron
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Desktop tag must be vX.Y.Z."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=${tag} electron/package.json=${version}"
          if [ "$tag" != "$version" ]; then
            echo "A tag v* tem de ser exactamente a versão de frontend/electron/package.json."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the app and the Electron main process
        working-directory: frontend
        run: |
          npm run build
          npx tsc -p electron/tsconfig.json
          npx tsc -p electron/tsconfig.preload.json
          mv -f electron/dist/preload.js electron/dist/preload.cjs
          cp electron/screen-picker.html electron/dist/screen-picker.html

      - name: Package the macOS disk image
        working-directory: frontend/electron
        run: npx --prefix .. electron-builder --projectDir .. --config "${GITHUB_WORKSPACE}/frontend/electron-builder.yml" --mac dmg --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: parley-macos
          path: |
            frontend/release/*.dmg
            frontend/release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parley-*
          path: artifacts
          merge-multiple: true

      - name: Publish installer checksums
        working-directory: artifacts
        run: |
          # One installer per platform in the current layout (AppImage, NSIS exe, DMG).
          # Revisit this count if multi-arch artifacts are added per platform.
          mapfile -d '' installers < <(find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \) -print0 | sort -z)
          if [ "${#installers[@]}" -ne 3 ]; then
            echo "Esperados três instaladores (AppImage, NSIS .exe, DMG); encontrados ${#installers[@]}."
            exit 1
          fi
          sha256sum "${installers[@]}" | sed 's#  \./#  #' > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Parley ${{ github.ref_name }}
          body: Rascunho gerado por .github/workflows/desktop-release.yml. Publicar manualmente depois de rever os instaladores.
          files: artifacts/**
