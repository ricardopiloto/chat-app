# LiveKit self-hosted + embedded TURN (D7). Keys must match backend LIVEKIT_API_KEY/SECRET.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

keys:
  instkey: instsecretinstsecretinstsecret12

# Active-speaker notification cadence (LiveKit v1.13.5 AudioConfig).
# Code defaults: update_interval 400 ms, smooth_intervals 2, active_level 35, min_percentile 40.
# Sample comments historically listed 500/4; leave thresholds unset so server defaults apply.
audio:
  update_interval: 200
  smooth_intervals: 2

turn:
  enabled: true
  udp_port: 3478
