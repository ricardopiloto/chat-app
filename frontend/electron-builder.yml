appId: com.mesa.desktop
productName: Mesa
copyright: Copyright © Mesa
extraMetadata:
  name: mesa
  author: Mesa
  description: Chat e vídeo self-hosted, com composição de câmaras e criptografia ponta a ponta.
  homepage: https://github.com/ricardopiloto/chat-app
  desktopName: mesa-chat-app.desktop
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - package.json
  - "!node_modules"
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: electron/icons/
  category: Network
  synopsis: Chat e vídeo self-hosted com cifra de ponta a ponta.
  description: >
    Chat e vídeo self-hosted, com composição de câmaras e criptografia ponta a
    ponta. Pensado para mesas de RPG e grupos pequenos que querem uma instância
    própria, sem o servidor ler o conteúdo das conversas.
  executableName: mesa-chat-app
  maintainer: Mesa
  syncDesktopName: true
  artifactName: "mesa-chat-app-${version}-${arch}.${ext}"
deb:
  packageName: mesa-chat-app
rpm:
  packageName: mesa-chat-app
win:
  target:
    - nsis
    - msi
  icon: electron/icons/icon.ico
  artifactName: "Mesa-${version}.${ext}"
mac:
  target:
    - dmg
  icon: electron/icons/icon.icns
  category: public.app-category.social-networking
  extendInfo:
    NSCameraUsageDescription: A Mesa usa a câmara para os canais de voz e vídeo.
    NSMicrophoneUsageDescription: A Mesa usa o microfone para os canais de voz e vídeo.
