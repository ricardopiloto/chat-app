appId: com.parley.desktop
productName: Parley
copyright: Copyright © Parley
extraMetadata:
  name: parley-chat-app
  author: Parley
  description: Chat e vídeo self-hosted, com composição de câmaras e criptografia ponta a ponta.
  homepage: https://github.com/ricardopiloto/chat-app
  desktopName: parley-chat-app.desktop
directories:
  output: release
files:
  - dist/**/*
  - electron/dist/**/*
  - package.json
  - "!node_modules"
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: electron/icons/
  category: Network
  synopsis: Chat e vídeo self-hosted com cifra de ponta a ponta.
  description: >
    Chat e vídeo self-hosted, com composição de câmaras e criptografia ponta a
    ponta. Pensado para mesas de RPG e grupos pequenos que querem uma instância
    própria, sem o servidor ler o conteúdo das conversas.
  executableName: parley-chat-app
  maintainer: Parley
  syncDesktopName: true
  artifactName: "parley-chat-app-${version}-${arch}.${ext}"
deb:
  packageName: parley-chat-app
rpm:
  packageName: parley-chat-app
win:
  target:
    - nsis
    - msi
  icon: electron/icons/icon.ico
  artifactName: "Parley-${version}.${ext}"
mac:
  target:
    - dmg
  icon: electron/icons/icon.png
  category: public.app-category.social-networking
  extendInfo:
    NSCameraUsageDescription: O Parley usa a câmara para os canais de voz e vídeo.
    NSMicrophoneUsageDescription: O Parley usa o microfone para os canais de voz e vídeo.
